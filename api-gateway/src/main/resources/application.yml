spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: resource-service
          uri: lb://RESOURCE-SERVICE
          predicates:
            - Path=/resources/**
        - id: song-service
          uri: lb://SONG-SERVICE
          predicates:
            - Path=/songs/**
        - id: storage-service
          uri: lb://STORAGE-SERVICE
          predicates:
            - Path=/storages/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,prometheus
  endpoint:
    gateway:
      enabled: true
  metrics:
    tags:
      # label of every metric, used by the Grafana dashboards
      application: ${spring.application.name}
    distribution:
      # histogram buckets: needed for the latency percentiles (histogram_quantile) in Grafana
      percentiles-histogram:
        http.server.requests: true

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}"
    registry-fetch-interval-seconds: 5
