spring:
  application:
    name: resource-service

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/resource_service}"
    driver-class-name: org.postgresql.Driver
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

services:
  config:
    song-service-client:
      base-url: "${SERVICES_CONFIG_SONG-SERVICE-CLIENT_BASE-URL:http://localhost:8081}"
      urls:
        post-metadata: /songs
        delete-metadata: /songs
