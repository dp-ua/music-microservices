spring:
  application:
    name: resource-service
  datasource:
    url: jdbc:h2:mem:music_db;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: admin
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

services:
  config:
    song-service-client:
      base-url: http://localhost:8082
      urls:
        post-metadata: api/v1/songs
        delete-metadata: api/v1/songs