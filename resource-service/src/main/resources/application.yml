spring:
  application:
    name: resource-service

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/resource_service}"
    driver-class-name: org.postgresql.Driver
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"

  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USER:rabbit}"
    password: "${RABBITMQ_PASSWORD:rabbit}"
    # the broker confirms that the message is stored, the publisher waits for it
    publisher-confirm-type: correlated
    # a message that can't be routed to a queue is returned instead of being silently dropped
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # "resource processed": a failed move (e.g. S3 is down) is retried, then the message is dropped
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

  cloud:
    openfeign:
      client:
        config:
          # fail fast: the circuit breaker must see that storage-service is down
          storage-service:
            connect-timeout: 1000
            read-timeout: 3000

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}"
    registry-fetch-interval-seconds: 5

storage:
  s3:
    endpoint: "${S3_ENDPOINT:http://localhost:4566}"
    region: "${S3_REGION:us-east-1}"
    access-key: "${S3_ACCESS_KEY:test}"
    secret-key: "${S3_SECRET_KEY:test}"
    # required for LocalStack (bucket in the path instead of the host name)
    path-style-access: true
  # Stub of the storage-service response (fallback of the circuit breaker), same structure as the real response
  stub:
    staging:
      id: 1
      storage-type: STAGING
      bucket: "${STAGING_BUCKET:staging-bucket}"
      path: /files
    permanent:
      id: 2
      storage-type: PERMANENT
      bucket: "${PERMANENT_BUCKET:permanent-bucket}"
      path: /files

# Circuit breaker of the calls to storage-service. While it is open (or the call fails), resource-service
# works with the stub storages (storage.stub), see StorageServiceClientProxyImpl.
resilience4j:
  circuitbreaker:
    instances:
      storage-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

messaging:
  resource-processed:
    queue: "${RABBITMQ_PROCESSED_QUEUE:resource.processed}"
  resource-uploaded:
    queue: "${RABBITMQ_QUEUE:resource.uploaded}"
    # wait for the broker confirm
    confirm-timeout: 2s
    # Short retry on purpose: the upload request waits for it (3 attempts, ~7 sec in the worst case)
    retry:
      max-attempts: 3
      delay-ms: 200
      multiplier: 2

services:
  config:
    song-service-client:
      urls:
        delete-metadata: /songs
    storage-service-client:
      urls:
        get-storages: /storages

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
