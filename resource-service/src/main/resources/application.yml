spring:
  application:
    name: resource-service
  datasource:
    url: jdbc:h2:mem:music_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

services:
  config:
    song-service-client:
      base-url: http://localhost:8082
      urls:
        post-metadata: api/v1/metadata