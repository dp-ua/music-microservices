spring:
  application:
    name: resource-service

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/resource_service}"
    driver-class-name: org.postgresql.Driver
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}"
    registry-fetch-interval-seconds: 5

storage:
  s3:
    endpoint: "${S3_ENDPOINT:http://localhost:4566}"
    region: "${S3_REGION:us-east-1}"
    bucket: "${S3_BUCKET:resources}"
    access-key: "${S3_ACCESS_KEY:test}"
    secret-key: "${S3_SECRET_KEY:test}"
    # required for LocalStack (bucket in the path instead of the host name)
    path-style-access: true

services:
  config:
    song-service-client:
      urls:
        delete-metadata: /songs
