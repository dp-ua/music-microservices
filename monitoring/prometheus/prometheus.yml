# Prometheus: scrapes /actuator/prometheus of the services every 10 seconds.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Services registered in Eureka (api-gateway, resource-service, song-service, storage-service).
  # Every instance is found automatically, also when a service is scaled (docker compose up --scale ...).
  - job_name: services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 15s
    relabel_configs:
      # scrape the container IP and port that the service registered in Eureka
      - source_labels: [__meta_eureka_app_instance_ip_addr, __meta_eureka_app_instance_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__

  # Eureka itself does not register in Eureka
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]
