plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.music'
version = '1.0.0'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

repositories {
    mavenCentral()
}

dependencies {
    // No web layer: plain Spring Boot application
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // Queue listener (RabbitMQ)
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Synchronous calls to resource-service and song-service by name, through Eureka
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // Retry of the synchronous calls (@Retryable needs AOP)
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Metadata extraction from mp3 files (Mp3Parser lives in the audio/video module)
    implementation "org.apache.tika:tika-core:$tikaVersion"
    implementation "org.apache.tika:tika-parser-audiovideo-module:$tikaVersion"

    implementation 'org.apache.commons:commons-lang3'

    //Lombok
    implementation "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
    }
}

// Test suites (unit, integration, component, contract): see gradle/testing.gradle
apply from: "$rootDir/gradle/testing.gradle"

dependencies {
    // integration tests: Feign + retry against WireMock, real RabbitMQ
    integrationTestImplementation "org.wiremock:wiremock-standalone:$wiremockVersion"
    integrationTestImplementation 'org.testcontainers:rabbitmq'

    // component tests: Cucumber scenarios, neighbour services are WireMock, real RabbitMQ
    componentTestImplementation "org.wiremock:wiremock-standalone:$wiremockVersion"
    componentTestImplementation 'org.testcontainers:rabbitmq'
    componentTestImplementation 'io.cucumber:cucumber-java'
    componentTestImplementation 'io.cucumber:cucumber-spring'
    componentTestImplementation 'io.cucumber:cucumber-junit-platform-engine'
    componentTestImplementation 'org.junit.platform:junit-platform-suite'

    // contract tests (Pact): resource-processor is a consumer of resource-service and song-service
    contractConsumerTestImplementation "au.com.dius.pact.consumer:junit5:$pactVersion"
}
