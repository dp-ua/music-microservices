services:

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    labels:
      # picked up by Filebeat (see monitoring/filebeat/filebeat.yml): only labelled containers are shipped to Elasticsearch
      co.elastic.logs/enabled: "true"
    environment:
      # JSON logs (ECS format) to stdout, the banner would break the JSON stream
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  resource-db:
    image: postgres:17-alpine
    container_name: resource-db
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  song-db:
    image: postgres:17-alpine
    container_name: song-db
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-db:
    image: postgres:17-alpine
    container_name: storage-db
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
      POSTGRES_USER: ${STORAGE_DB_USER}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - ./init-scripts/storage-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORAGE_DB_USER} -d ${STORAGE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3 emulator for MP3 files of resource-service.
  # The STAGING and PERMANENT buckets are created by init-scripts/localstack/01-create-bucket.sh once LocalStack is ready.
  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack
    environment:
      SERVICES: s3
      STAGING_BUCKET: ${STAGING_BUCKET:-staging-bucket}
      PERMANENT_BUCKET: ${PERMANENT_BUCKET:-permanent-bucket}
    ports:
      - "4566:4566"
    volumes:
      - ./init-scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Message broker: resource-service publishes "resource uploaded" events, resource-processor consumes them.
  # The queue itself is declared (durable) by the services on startup. UI: http://localhost:15672
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      # keeps durable queues and persistent messages across container restarts
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---- Logging: services write JSON logs to stdout, Filebeat ships them to Elasticsearch ----

  # Log storage. Single node, security off: local environment only. Query: http://localhost:9200/music-logs-*/_search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Log collector: reads the stdout logs of the containers labelled co.elastic.logs/enabled=true (through the Docker
  # socket and the Docker log files) and writes them to the index music-logs-<date>.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: filebeat
    user: root
    # strict.perms=false: the config file is mounted from the host (e.g. Windows) and has other owner/permissions
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ---- Monitoring: Prometheus scrapes the metrics, Grafana shows the dashboards (and the logs from Elasticsearch) ----

  # Finds the services through Eureka and scrapes /actuator/prometheus. UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dashboards "JVM" and "API Gateway". UI: http://localhost:3000 (admin/admin).
  # Data sources and dashboards are provisioned from monitoring/grafana.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    # No fixed port mapping and no container_name: random host port, Eureka handles discovery, can be scaled
    labels:
      # picked up by Filebeat (see monitoring/filebeat/filebeat.yml): only labelled containers are shipped to Elasticsearch
      co.elastic.logs/enabled: "true"
    environment:
      # JSON logs (ECS format) to stdout, the banner would break the JSON stream
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      SPRING_DATASOURCE_URL: ${RESOURCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-resource.uploaded}
      RABBITMQ_PROCESSED_QUEUE: ${RABBITMQ_PROCESSED_QUEUE:-resource.processed}
    depends_on:
      resource-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # No web interface and no ports. Listens to the queue, then synchronously (through Eureka):
  # downloads the mp3 from resource-service and saves the extracted metadata to song-service.
  resource-processor:
    build:
      context: .
      dockerfile: resource-processor/Dockerfile
    restart: unless-stopped
    labels:
      # picked up by Filebeat (see monitoring/filebeat/filebeat.yml): only labelled containers are shipped to Elasticsearch
      co.elastic.logs/enabled: "true"
    environment:
      # JSON logs (ECS format) to stdout, the banner would break the JSON stream
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-resource.uploaded}
      RABBITMQ_PROCESSED_QUEUE: ${RABBITMQ_PROCESSED_QUEUE:-resource.processed}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      song-service:
        condition: service_healthy
    # no web interface: healthy while the JVM process is alive
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]pp.jar' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Storage types (STAGING / PERMANENT) and their buckets. resource-service calls it through Eureka, behind a
  # circuit breaker: when this service is down, resource-service works with stub data.
  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    # No fixed port mapping and no container_name: random host port, Eureka handles discovery, can be scaled
    labels:
      # picked up by Filebeat (see monitoring/filebeat/filebeat.yml): only labelled containers are shipped to Elasticsearch
      co.elastic.logs/enabled: "true"
    environment:
      # JSON logs (ECS format) to stdout, the banner would break the JSON stream
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      SPRING_DATASOURCE_URL: ${STORAGE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${STORAGE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${STORAGE_DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
    depends_on:
      storage-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  song-service:
    build:
      context: .
      dockerfile: song-service/Dockerfile
    # No fixed port mapping and no container_name: random host port, Eureka handles discovery, can be scaled
    labels:
      # picked up by Filebeat (see monitoring/filebeat/filebeat.yml): only labelled containers are shipped to Elasticsearch
      co.elastic.logs/enabled: "true"
    environment:
      # JSON logs (ECS format) to stdout, the banner would break the JSON stream
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      SPRING_DATASOURCE_URL: ${SONG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
    depends_on:
      song-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    labels:
      # picked up by Filebeat (see monitoring/filebeat/filebeat.yml): only labelled containers are shipped to Elasticsearch
      co.elastic.logs/enabled: "true"
    environment:
      # JSON logs (ECS format) to stdout, the banner would break the JSON stream
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
  elasticsearch-data:
  filebeat-data:
  prometheus-data:
  grafana-data:
